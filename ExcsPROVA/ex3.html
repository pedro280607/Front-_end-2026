<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Grupos e Fatos</title>

    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 30px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 20px;
            width: 280px;
            color: #333;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Grupos e Fatos</h1>

    <button onclick="proximoGrupo()">Próximo</button>

    <div class="container">
        <div class="card" id="grupo-a">
            <h2>🅰️ Grupo A</h2>
            <ul>
                <li>México</li>
                <li>África do Sul</li>
                <li>Coreia do Sul</li>
                <li>República Tcheca</li>
            </ul>
        </div>

        <div class="card" id="grupo-b">
            <h2>🅱️ Grupo B</h2>
            <ul>
                <li>Canadá</li>
                <li>Suíça</li>
                <li>Catar</li>
                <li>Bósnia</li>
            </ul>
        </div>

        <div class="card" id="grupo-c">
            <h2>🅲 Grupo C</h2>
            <ul>
                <li>Brasil</li>
                <li>Marrocos</li>
                <li>Haiti</li>
                <li>Escócia</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
