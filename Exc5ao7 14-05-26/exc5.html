<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinity Bank - Lista VIP</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, Helvetica, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#0f172a,#1e293b);
    }

    .card{
        width:400px;
        background:white;
        padding:25px;
        border-radius:15px;
        box-shadow:0 4px 15px rgba(0,0,0,0.2);
    }

    h1{
        text-align:center;
        margin-bottom:20px;
        color:#0f172a;
        font-size:24px;
    }

    .area-input{
        display:flex;
        gap:10px;
        margin-bottom:20px;
    }

    input{
        flex:1;
        padding:10px;
        border:1px solid #ccc;
        border-radius:8px;
        outline:none;
    }

    button{
        padding:8px 12px;
        border:none;
        border-radius:8px;
        cursor:pointer;
        transition:0.3s;
    }

    .btn-add{
        background:#2563eb;
        color:white;
    }

    .btn-add:hover{
        background:#1d4ed8;
    }

    ul{
        list-style:none;
    }

    li{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:12px 0;
        border-bottom:1px solid #ddd;
    }

    .acoes{
        display:flex;
        gap:5px;
    }

    .concluir{
        background:#16a34a;
        color:white;
    }

    .editar{
        background:#f59e0b;
        color:white;
    }

    .excluir{
        background:#dc2626;
        color:white;
    }

    .riscado{
        text-decoration:line-through;
        color:gray;
    }
</style>
</head>

<body>

<div class="card">
    <h1>Infinity Bank - VIP</h1>

    <div class="area-input">
        <input type="text" id="nomeConvidado" placeholder="Digite o nome">
        <button class="btn-add" onclick="adicionarConvidado()">Adicionar</button>
    </div>

    <ul id="listaConvidados"></ul>
</div>

<script>

    let convidados = [];

    function adicionarConvidado(){

        let input = document.getElementById("nomeConvidado");
        let nome = input.value.trim();

        if(nome === ""){
            alert("Digite um nome válido!");
            return;
        }

        convidados.push(nome);

        atualizarLista();

        input.value = "";
    }

    function atualizarLista(){

        let lista = document.getElementById("listaConvidados");

        lista.innerHTML = "";

        convidados.forEach((convidado, index) => {

            let li = document.createElement("li");

            let span = document.createElement("span");
            span.textContent = convidado;

            let divAcoes = document.createElement("div");
            divAcoes.classList.add("acoes");

            // Botão concluir
            let btnConcluir = document.createElement("button");
            btnConcluir.textContent = "Concluir";
            btnConcluir.classList.add("concluir");

            btnConcluir.onclick = () => {
                span.classList.toggle("riscado");
            };

            // Botão editar
            let btnEditar = document.createElement("button");
            btnEditar.textContent = "Editar";
            btnEditar.classList.add("editar");

            btnEditar.onclick = () => {

                let novoNome = prompt("Digite o novo nome:", convidado);

                if(novoNome !== null && novoNome.trim() !== ""){
                    convidados[index] = novoNome.trim();
                    atualizarLista();
                }
            };

            // Botão excluir
            let btnExcluir = document.createElement("button");
            btnExcluir.textContent = "Excluir";
            btnExcluir.classList.add("excluir");

            btnExcluir.onclick = () => {
                convidados.splice(index,1);
                atualizarLista();
            };

            divAcoes.appendChild(btnConcluir);
            divAcoes.appendChild(btnEditar);
            divAcoes.appendChild(btnExcluir);

            li.appendChild(span);
            li.appendChild(divAcoes);

            lista.appendChild(li);

        });
    }

</script>

</body>
</html>
