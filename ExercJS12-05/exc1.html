<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Validador de CPF</title>

<style>

body{
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;

    display: flex;
    justify-content: center;
    align-items: center;

    height: 100vh;
}

.container{
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);

    text-align: center;
    width: 300px;
}

input{
    width: 90%;
    padding: 10px;
    margin: 10px 0;
    font-size: 16px;
}

button{
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
}

#resultado{
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
}

.valido{
    color: green;
}

.invalido{
    color: red;
}

</style>
</head>

<body>

<div class="container">

    <h2>Validador de CPF</h2>

    <input type="text" id="cpf" placeholder="Digite o CPF">

    <br><br>

    <button onclick="validarCPF()">Validar</button>

    <div id="resultado"></div>

</div>

<script>

function validarCPF(){

    let cpf = document.getElementById("cpf").value;

    
    cpf = cpf.replace(/\D/g, "");

    
    if(cpf.length != 11){
        mostrarResultado("CPF Inválido", false);
        return;
    }

    
    if(/^(\d)\1+$/.test(cpf)){
        mostrarResultado("CPF Inválido", false);
        return;
    }

    
    let soma = 0;

    for(let i = 0; i < 9; i++){
        soma += parseInt(cpf.charAt(i)) * (10 - i);
    }

    let resto = (soma * 10) % 11;

    if(resto == 10 || resto == 11){
        resto = 0;
    }

    if(resto != parseInt(cpf.charAt(9))){
        mostrarResultado("CPF Inválido", false);
        return;
    }

    
    soma = 0;

    for(let i = 0; i < 10; i++){
        soma += parseInt(cpf.charAt(i)) * (11 - i);
    }

    resto = (soma * 10) % 11;

    if(resto == 10 || resto == 11){
        resto = 0;
    }

    if(resto != parseInt(cpf.charAt(10))){
        mostrarResultado("CPF Inválido", false);
        return;
    }

    
    mostrarResultado("CPF Válido", true);
}

function mostrarResultado(texto, valido){

    let resultado = document.getElementById("resultado");

    resultado.innerHTML = texto;

    if(valido){
        resultado.className = "valido";
    }
    else{
        resultado.className = "invalido";
    }
}

</script>

</body>
</html>
