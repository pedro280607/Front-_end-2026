<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinity Bank</title>

  <style>

    body{
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container{
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      width: 350px;
    }

    h1{
      text-align: center;
    }

    input, select, button{
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }

    #resultado{
      margin-top: 20px;
      font-size: 18px;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>Infinity Bank</h1>

    <label>Bandeira:</label>

    <select id="bandeira">
      <option value="visa">Visa</option>
      <option value="master">Master</option>
      <option value="elo">Elo</option>
    </select>

    <label>Valor da Venda:</label>
    <input type="number" id="valor" placeholder="Digite o valor">

    <label>Quantidade de Parcelas:</label>
    <input type="number" id="parcelas" placeholder="Digite as parcelas">

    <button id="calcular">Calcular</button>

    <div id="resultado"></div>

  </div>

  <script>

    const botao = document.getElementById("calcular");

    botao.addEventListener("click", function(){

      let bandeira = document.getElementById("bandeira").value;

      let valor = Number(document.getElementById("valor").value);

      let parcelas = Number(document.getElementById("parcelas").value);

      let taxa = 0;

      switch(bandeira){

        case "visa":
          taxa = valor * 0.02;
          break;

        case "master":
          taxa = valor * 0.0185;
          break;

        case "elo":
          taxa = valor * 0.03;
          break;

      }

      // Juros simples
      let juros = valor * (0.015 * parcelas);

      // Taxa fixa mensal
      let taxaMensal = parcelas * 12.50;

      // Valor total
      let total = valor + taxa + juros + taxaMensal;

      // Valor de cada parcela
      let valorParcela = total / parcelas;

      let resultado = document.getElementById("resultado");

      resultado.innerHTML =
      "<strong>Resumo da Venda</strong><br><br>" +
      "Valor da Taxa: R$ " + taxa.toFixed(2) + "<br>" +
      "Valor dos Juros: R$ " + juros.toFixed(2) + "<br>" +
      "Taxa Mensal: R$ " + taxaMensal.toFixed(2) + "<br>" +
      "Valor Total: R$ " + total.toFixed(2) + "<br>" +
      "Valor de cada Parcela: R$ " + valorParcela.toFixed(2);

    });

  </script>

</body>
</html>
