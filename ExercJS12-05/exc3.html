<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Média Escolar</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container{
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      width: 320px;
      text-align: center;
    }

    input{
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      font-size: 16px;
    }

    button{
      padding: 10px 20px;
      margin-top: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #resultado{
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    .aprovado{
      color: blue;
    }

    .exame{
      color: green;
    }

    .reprovado{
      color: red;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>Média Escolar</h1>

    <input type="text" id="nome" placeholder="Nome do aluno">

    <input type="number" id="nota1" placeholder="Nota 1">

    <input type="number" id="nota2" placeholder="Nota 2">

    <input type="number" id="nota3" placeholder="Nota 3">

    <button id="calcular">Calcular Média</button>

    <div id="resultado"></div>

  </div>

  <script>

    const botao = document.getElementById("calcular");

    botao.addEventListener("click", function(){

      let nome = document.getElementById("nome").value;

      let nota1 = Number(document.getElementById("nota1").value);
      let nota2 = Number(document.getElementById("nota2").value);
      let nota3 = Number(document.getElementById("nota3").value);

      let media = (nota1 + nota2 + nota3) / 3;

      let resultado = document.getElementById("resultado");

      if(media >= 7){

        resultado.innerHTML =
        nome + " está APROVADO!<br>Média: " + media.toFixed(2);

        resultado.className = "aprovado";

      }

      else if(media >= 4){

        let falta = 10 - media;

        resultado.innerHTML =
        nome + " está em EXAME!<br>Média: " + media.toFixed(2) +
        "<br>Faltam " + falta.toFixed(2) + " pontos para chegar em 10.";

        resultado.className = "exame";

      }

      else{

        resultado.innerHTML =
        nome + " está REPROVADO!<br>Média: " + media.toFixed(2);

        resultado.className = "reprovado";

      }

    });

  </script>

</body>
</html>
