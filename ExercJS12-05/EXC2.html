<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor Dinâmico</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container{
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      width: 300px;
      text-align: center;
    }

    input{
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
    }

    h1{
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Conversor de Temperatura</h1>

    <label>Celsius (°C)</label>
    <input type="number" id="celsius" step="0.1">

    <label>Fahrenheit (°F)</label>
    <input type="number" id="fahrenheit" step="0.1">
  </div>

  <script>
    const celsius = document.getElementById("celsius");
    const fahrenheit = document.getElementById("fahrenheit");

    // Celsius -> Fahrenheit
    celsius.addEventListener("input", function() {

      let c = parseFloat(celsius.value);

      if (!isNaN(c)) {
        let f = (c * 9/5) + 32;
        fahrenheit.value = f.toFixed(2);
      } else {
        fahrenheit.value = "";
      }

    });

    // Fahrenheit -> Celsius
    fahrenheit.addEventListener("input", function() {

      let f = parseFloat(fahrenheit.value);

      if (!isNaN(f)) {
        let c = (f - 32) * 5/9;
        celsius.value = c.toFixed(2);
      } else {
        celsius.value = "";
      }

    });
  </script>

</body>
</html>
